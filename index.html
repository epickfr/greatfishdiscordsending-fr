<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Submit</title>
</head>
<body style="font-family: Arial; display: flex; justify-content: center; margin-top: 50px; background: #fafafa;">
    <div style="background: white; padding: 30px; border: 1px solid #ddd; border-radius: 8px; width: 320px;">
        <h2>Send a Message</h2>
        <form id="secureForm">
            <label style="display:block; margin-bottom:5px; font-weight:bold;">Name:</label>
            <input type="text" id="name" required style="width:100%; padding:8px; margin-bottom:15px; box-sizing:border-box;">
            
            <label style="display:block; margin-bottom:5px; font-weight:bold;">Message:</label>
            <textarea id="message" required style="width:100%; padding:8px; margin-bottom:15px; height:100px; box-sizing:border-box; resize:none;"></textarea>
            
            <button type="submit" style="width:100%; padding:10px; background:#5865F2; color:#fff; border:none; border-radius:4px; cursor:pointer; font-weight:bold;">Submit</button>
        </form>
        <p id="status" style="margin-top:15px; font-weight:bold; text-align:center;"></p>
    </div>

    <script>
        document.getElementById('secureForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const status = document.getElementById('status');
            status.innerText = "Sending securely...";

            const response = await fetch('/submit-form', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: document.getElementById('name').value,
                    message: document.getElementById('message').value
                })
            });

            const result = await response.json();
            if(result.success) {
                status.style.color = "green";
                status.innerText = "Sent to Discord successfully!";
                document.getElementById('secureForm').reset();
            } else {
                status.style.color = "red";
                status.innerText = "Error sending message.";
            }
        });
    </script>
</body>
</html>
